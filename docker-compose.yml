version: '3'

services:
  # Elasticsearch for log storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.7
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    restart: unless-stopped
    networks:
      - monitoring-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200/_cluster/health']
      interval: 30s
      timeout: 10s
      retries: 3
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2g

  # Logstash for log processing
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.7
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - '5044:5044' # Filebeat input
      - '5001:5001/tcp' # TCP log input
      - '5001:5001/udp' # UDP log input
    environment:
      LS_JAVA_OPTS: '-Xmx512m -Xms512m'
    networks:
      - monitoring-network
    depends_on:
      - elasticsearch
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9600']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.7
    ports:
      - '5601:5601'
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    networks:
      - monitoring-network
    depends_on:
      - elasticsearch
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5601/api/status']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  # Flower for Celery task monitoring
  flower:
    image: mher/flower
    ports:
      - '5555:5555'
    environment:
      - FLOWER_BASIC_AUTH=${FLOWER_USER}:${FLOWER_PASSWORD}
      - FLOWER_URL_PREFIX=flower
      - BROKER_URL=${RABBITMQ_URL}
    command: >
      celery flower 
      --broker=${RABBITMQ_URL} 
      --broker_api=${RABBITMQ_MANAGEMENT_URL} 
      --persistent=True 
      --db=/data/flower.db 
      --state_save_interval=10000
    volumes:
      - flower-data:/data
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5555/flower/']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  # Caddy as a reverse proxy
  caddy:
    image: caddy:2.6.4
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kibana
      - flower
    networks:
      - monitoring-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  elasticsearch-data:
  flower-data:
  caddy-data:
  caddy-config:

networks:
  monitoring-network:
    driver: bridge
