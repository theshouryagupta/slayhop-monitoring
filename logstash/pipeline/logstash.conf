input {
  # Receive logs from Filebeat instances on worker servers
  beats {
    port => 5044
    host => "0.0.0.0"
    client_inactivity_timeout => 60
    add_field => { "source" => "filebeat" }
  }
  
  # Direct TCP input for log shipping
  tcp {
    port => 5001
    codec => json
    add_field => { "source" => "tcp" }
  }
  
  # Direct UDP input for log shipping
  udp {
    port => 5001
    codec => json
    add_field => { "source" => "udp" }
  }
}

filter {
  # Add timestamp if not already present
  if ![timestamp] and ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Process Celery-specific logs
  if [type] == "celery" or [message] =~ /celery/ {
    # Try to parse celery log format
    grok {
      match => { 
        "message" => [
          "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:celery.process}\] %{LOGLEVEL:log.level} %{GREEDYDATA:log.message}",
          "%{TIMESTAMP_ISO8601:timestamp} - %{DATA:logger} - %{LOGLEVEL:log.level} - %{GREEDYDATA:log.message}"
        ]
      }
      break_on_match => true
    }
    
    if "_grokparsefailure" not in [tags] and [timestamp] {
      date {
        match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS" ]
        target => "@timestamp"
      }
    }
    
    # Extract task information if available
    if [log.message] =~ /\[.*Task/ {
      grok {
        match => { "log.message" => "\[%{DATA:task.id}\] %{GREEDYDATA:task.message}" }
        tag_on_failure => ["_taskparsefailure"]
      }
    }
    
    # Add server identification if available
    if [server_name] {
      mutate {
        add_field => { "server" => "%{server_name}" }
      }
    }
    
    # Extract task-specific fields
    if [task_id] {
      mutate {
        add_field => { "task.id" => "%{task_id}" }
      }
    }
    
    if [task_name] {
      mutate {
        add_field => { "task.name" => "%{task_name}" }
      }
    }
    
    # Tag error messages
    if [log.level] == "ERROR" or [log.level] == "CRITICAL" {
      mutate {
        add_tag => ["error"]
      }
    }
  }
  
  # JSON parsing for structured logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed_json"
    }
  }
}

output {
  # Send all logs to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "celery-logs-%{+YYYY.MM.dd}"
    
    # Optional template settings
    template_name => "celery-logs"
    template_overwrite => true
    
    # Optional document ID for deduplication
    # document_id => "%{[@metadata][task_id]}"
  }
  
  # Send error logs to a separate index for easier monitoring
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "celery-errors-%{+YYYY.MM}"
    }
  }
  
  # Send task-specific logs to a dedicated index for task monitoring
  if [task.id] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "celery-tasks-%{+YYYY.MM}"
      document_id => "%{[task.id]}"
    }
  }
  
  # Debug output for development (comment out in production)
  # stdout {
  #   codec => rubydebug {
  #     metadata => true
  #   }
  # }
}