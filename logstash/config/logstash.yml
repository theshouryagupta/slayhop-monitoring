http.host: '0.0.0.0'
path.config: /usr/share/logstash/pipeline
xpack.monitoring.enabled: false

# Path where logs will be stored
path.logs: /var/log/logstash

# Enable automatic configuration reloading
config.reload.automatic: true
config.reload.interval: 30s

# Queue settings
queue.type: persisted
queue.max_bytes: 1gb

# JVM heap size - adjust based on your server resources
# Recommended to set to 50% of available RAM up to 4GB
# For a server with 8GB total: 4g
# For a server with 4GB total: 2g
# For a server with 16GB total: 4g
jvm.heap.initial: 1g
jvm.heap.max: 1g

# Pipeline settings
pipeline.workers: 2
pipeline.batch.size: 125
pipeline.batch.delay: 50

# Set to true to precompile pipeline configurations
config.support_escapes: true

# Dead letter queue settings - where unprocessable events are stored
dead_letter_queue.enable: true
