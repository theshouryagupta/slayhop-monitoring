name: Deploy ELK Monitoring Stack

on:
  push:
    branches:
      - prod
    paths:
      - 'monitoring/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.MONITORING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
        run: |
          # Create needed directories on the server
          ssh root@$SERVER_IP "mkdir -p $DEPLOY_PATH/logstash/config $DEPLOY_PATH/logstash/pipeline"

          # Sync all files to the server
          rsync -avz --exclude '.git' --exclude '.github' ./monitoring/ root@$SERVER_IP:$DEPLOY_PATH

      - name: Create .env file
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
        run: |
          cat > .env <<EOL
          ELASTIC_PASSWORD=$ELASTIC_PASSWORD
          EOL

          scp .env root@$SERVER_IP:$DEPLOY_PATH/.env

      - name: Make initialization script executable
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
        run: |
          ssh root@$SERVER_IP "chmod +x $DEPLOY_PATH/initialize-elk.sh"

      - name: Determine if full reset is needed
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        id: reset_check
        run: |
          if [[ "$COMMIT_MSG" == *"[reset-elk]"* ]]; then
            echo "reset_needed=true" >> $GITHUB_OUTPUT
          else
            echo "reset_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Initialize or restart ELK stack
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
          RESET_NEEDED: ${{ steps.reset_check.outputs.reset_needed }}
        run: |
          if [ "$RESET_NEEDED" = "true" ]; then
            echo "Performing full reset of ELK stack..."
            ssh root@$SERVER_IP "cd $DEPLOY_PATH && ./initialize-elk.sh reset"
          else
            echo "Restarting ELK stack..."
            ssh root@$SERVER_IP "cd $DEPLOY_PATH && ./initialize-elk.sh"
          fi

      - name: Check ELK services status
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
        run: |
          echo "Checking ELK services status (after 30s to allow startup)..."
          sleep 30
          ssh root@$SERVER_IP "docker ps | grep 'elastic\|kibana\|logstash'"
