name: Deploy ELK Monitoring Stack

on:
  push:
    branches:
      - prod
    paths:
      - 'monitoring/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.MONITORING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
        run: |
          rsync -avz --exclude '.git' --exclude '.github' ./monitoring/ root@$SERVER_IP:$DEPLOY_PATH

      - name: Create .env file
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
          KIBANA_SYSTEM_PASSWORD: ${{ secrets.KIBANA_SYSTEM_PASSWORD }}
        run: |
          cat > .env <<EOL
          ELASTIC_PASSWORD=$ELASTIC_PASSWORD
          KIBANA_SYSTEM_PASSWORD=$KIBANA_SYSTEM_PASSWORD
          EOL

          scp .env root@$SERVER_IP:$DEPLOY_PATH/.env

      - name: Create required directories
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
        run: |
          ssh root@$SERVER_IP "mkdir -p $DEPLOY_PATH/logstash/config $DEPLOY_PATH/logstash/pipeline"

      - name: Copy Logstash configuration
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
        run: |
          scp ./monitoring/logstash/config/logstash.yml root@$SERVER_IP:$DEPLOY_PATH/logstash/config/
          scp ./monitoring/logstash/pipeline/celery.conf root@$SERVER_IP:$DEPLOY_PATH/logstash/pipeline/

      - name: Restart Docker containers
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
        run: |
          ssh root@$SERVER_IP "cd $DEPLOY_PATH && docker compose down && docker compose up -d"
