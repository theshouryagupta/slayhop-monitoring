name: Deploy ELK Monitoring Stack 7.x

on:
  push:
    branches:
      - prod
    paths:
      - 'monitoring/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.MONITORING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
        run: |
          # First, ensure the directory exists
          ssh root@$SERVER_IP "mkdir -p $DEPLOY_PATH"

          # Copy the docker-compose.yml file
          scp ./monitoring/docker-compose.yml root@$SERVER_IP:$DEPLOY_PATH/

          # Copy the .env.template file
          scp ./monitoring/.env.template root@$SERVER_IP:$DEPLOY_PATH/

          # Copy the setup script
          scp ./monitoring/setup-elk-7x.sh root@$SERVER_IP:$DEPLOY_PATH/
          ssh root@$SERVER_IP "chmod +x $DEPLOY_PATH/setup-elk-7x.sh"

      - name: Create .env file
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
        run: |
          cat > .env <<EOL
          ELASTIC_PASSWORD=$ELASTIC_PASSWORD
          EOL

          scp .env root@$SERVER_IP:$DEPLOY_PATH/.env

      - name: Run setup script
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          DEPLOY_PATH: ${{ secrets.MONITORING_DEPLOY_PATH }}
        run: |
          ssh root@$SERVER_IP "cd $DEPLOY_PATH && ./setup-elk-7x.sh"

      - name: Check service status
        env:
          SERVER_IP: ${{ secrets.MONITORING_HOST }}
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
        run: |
          echo "Giving services time to start up (60 seconds)..."
          sleep 60
          echo "Checking container status:"
          ssh root@$SERVER_IP "docker ps"
          echo "Elasticsearch status:"
          ssh root@$SERVER_IP "curl -s -u elastic:$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep status"
