input {
  beats {
    port => 5044
  }
}

filter {
  if "celery-service-1" in [tags] {
    mutate {
      add_field => { "[@metadata][app]" => "celery-service-1" }
    }
    
    if [message] =~ "ERROR" {
      mutate {
        add_tag => ["error"]
      }
    }
  }
  
  if "celery-service-2" in [tags] {
    mutate {
      add_field => { "[@metadata][app]" => "celery-service-2" }
    }
    
    if [message] =~ "ERROR" {
      mutate {
        add_tag => ["error"]
      }
    }
    
    # Extract task name if available
    if [message] =~ /\[([^\]]+)\(([^\)]+)\)\]/ {
      grok {
        match => { "message" => "\[%{DATA:task_name}\(%{DATA:task_id}\)\]" }
      }
    }
  }
  
  if [message] =~ /\[(\w+)\]/ {
    grok {
      match => { "message" => "\[%{LOGLEVEL:log_level}\]" }
    }
  }
  
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTIC_HOSTS}"]
    user => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    index => "celery-logs-%{[@metadata][app]}-%{+YYYY.MM.dd}"
    template_name => "celery-logs"
    template_overwrite => true
    
    # Define error policy to prevent the retry error
    action => "index"
    retries => 5
    retry_on_conflict => 3
    
    # Don't validate certs if that's causing issues
    ssl_certificate_verification => false
  }
  
  # For debugging - uncomment if needed
  # stdout { codec => rubydebug }
}